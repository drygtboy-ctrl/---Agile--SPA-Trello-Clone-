<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agile Kanban Board — Канбан-дошка для керування проєктами</title>
<meta name="description" content="Інтерактивна Канбан-дошка на чистому JavaScript з нативним Drag and Drop.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Onest', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
  body { background: #09090b; }

  /* Колонка: підсвічування під час перетягування */
  .col { transition: background-color .2s, border-color .2s, box-shadow .2s; }
  .col.drag-over {
    background: rgba(99, 102, 241, .07);
    border-color: rgba(129, 140, 248, .6);
    box-shadow: 0 0 0 1px rgba(129, 140, 248, .35), 0 0 36px -12px rgba(99, 102, 241, .5);
  }

  /* Картка */
  .card { cursor: grab; transition: transform .2s, border-color .2s, box-shadow .2s, opacity .2s; }
  .card:hover { transform: translateY(-2px); border-color: #3f3f46; box-shadow: 0 10px 24px -14px #000; }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .35; transform: scale(.97) rotate(-1deg); }
  .card.enter { animation: pop .4s cubic-bezier(.2, .9, .3, 1.15); }
  .card.leave { animation: out .22s ease forwards; pointer-events: none; }

  /* Місце, куди впаде картка */
  .drop-ph {
    height: 72px; border-radius: 8px; border: 1.5px dashed rgba(129, 140, 248, .65);
    background: rgba(99, 102, 241, .08); animation: fade .15s ease;
  }
  .list:has(.drop-ph) .empty { display: none; }

  .bump { animation: bump .3s ease; }
  .toast { animation: slide .3s cubic-bezier(.2, .9, .3, 1.1); }
  .toast.out { animation: slideOut .25s ease forwards; }
  #modal:not(.hidden) .box { animation: pop .28s cubic-bezier(.2, .9, .3, 1.1); }

  @keyframes pop { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: scale(.88); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bump { 50% { transform: scale(1.35); } }
  @keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(24px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body class="min-h-screen font-sans text-zinc-200 antialiased">

<div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">

  <header class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3.5">
      <div class="grid h-10 w-10 place-items-center rounded-lg bg-indigo-500">
        <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="5" height="14" rx="1.5"/><rect x="10" y="4" width="5" height="9" rx="1.5"/><rect x="17" y="4" width="4" height="12" rx="1.5"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-white sm:text-2xl">Agile Kanban Board</h1>
        <p class="text-sm text-zinc-500">Спринт 12: розробка вебплатформи</p>
      </div>
    </div>
    <button id="add" type="button" class="inline-flex items-center gap-2 rounded-lg bg-indigo-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-indigo-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 active:scale-95">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 4a1 1 0 011 1v4h4a1 1 0 110 2h-4v4a1 1 0 11-2 0v-4H5a1 1 0 110-2h4V5a1 1 0 011-1z"/></svg>
      Додати задачу
    </button>
  </header>

  <div class="mt-7 flex items-center gap-3">
    <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-zinc-800">
      <div id="bar" class="h-full rounded-full bg-indigo-500 transition-all duration-500" style="width:0%"></div>
    </div>
    <span id="stat" class="text-xs tabular-nums text-zinc-400"></span>
  </div>

  <main id="board" class="mt-6 grid items-start gap-4 md:grid-cols-3"></main>

  <footer class="mt-10 flex flex-wrap items-center justify-between gap-3 text-xs text-zinc-600">
    <span>Перетягуйте картки між колонками. Зміни зберігаються у вашому браузері.</span>
    <button id="reset" type="button" class="rounded-md px-2 py-1 text-zinc-500 transition hover:bg-zinc-900 hover:text-zinc-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">Відновити демо-дані</button>
  </footer>
</div>

<!-- Модальне вікно нової задачі -->
<div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" data-close></div>
  <form id="form" novalidate class="box relative w-full max-w-md rounded-xl border border-zinc-800 bg-zinc-950 p-6 shadow-2xl shadow-black/60">
    <div class="mb-5 flex items-center justify-between">
      <h2 id="modal-title" class="text-lg font-semibold text-white">Нова задача</h2>
      <button type="button" data-close aria-label="Закрити" class="rounded-md p-1.5 text-zinc-500 transition hover:bg-zinc-800 hover:text-zinc-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.3 5.3a1 1 0 011.4 0L10 8.6l3.3-3.3a1 1 0 111.4 1.4L11.4 10l3.3 3.3a1 1 0 01-1.4 1.4L10 11.4l-3.3 3.3a1 1 0 01-1.4-1.4L8.6 10 5.3 6.7a1 1 0 010-1.4z"/></svg>
      </button>
    </div>

    <label for="f-title" class="block text-xs font-medium text-zinc-400">Назва <span class="text-rose-400">*</span></label>
    <input id="f-title" maxlength="80" autocomplete="off" placeholder="Наприклад: підготувати макет сторінки оплати"
      class="mt-1.5 w-full rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30">
    <p id="f-err" class="mt-1.5 hidden text-xs text-rose-400">Введіть назву задачі, щоб додати її на дошку.</p>

    <label for="f-desc" class="mt-4 block text-xs font-medium text-zinc-400">Опис</label>
    <textarea id="f-desc" rows="3" maxlength="240" placeholder="Коротко опишіть, що потрібно зробити"
      class="mt-1.5 w-full resize-none rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30"></textarea>

    <span class="mt-4 block text-xs font-medium text-zinc-400">Пріоритет</span>
    <div class="mt-1.5 grid grid-cols-3 gap-2">
      <label class="cursor-pointer"><input type="radio" name="priority" value="high" class="peer sr-only">
        <span class="block rounded-lg border border-zinc-800 py-2 text-center text-xs font-medium text-zinc-400 transition hover:border-zinc-700 peer-checked:border-rose-500/60 peer-checked:bg-rose-500/10 peer-checked:text-rose-300 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400">Високий</span></label>
      <label class="cursor-pointer"><input type="radio" name="priority" value="medium" class="peer sr-only" checked>
        <span class="block rounded-lg border border-zinc-800 py-2 text-center text-xs font-medium text-zinc-400 transition hover:border-zinc-700 peer-checked:border-amber-500/60 peer-checked:bg-amber-500/10 peer-checked:text-amber-300 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400">Середній</span></label>
      <label class="cursor-pointer"><input type="radio" name="priority" value="low" class="peer sr-only">
        <span class="block rounded-lg border border-zinc-800 py-2 text-center text-xs font-medium text-zinc-400 transition hover:border-zinc-700 peer-checked:border-emerald-500/60 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-300 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400">Низький</span></label>
    </div>

    <div class="mt-6 flex justify-end gap-2.5">
      <button type="button" data-close class="rounded-lg px-4 py-2.5 text-sm font-medium text-zinc-400 transition hover:bg-zinc-900 hover:text-zinc-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">Скасувати</button>
      <button type="submit" class="rounded-lg bg-indigo-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-indigo-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 active:scale-95">Додати задачу</button>
    </div>
  </form>
</div>

<div id="toasts" class="pointer-events-none fixed bottom-5 right-5 z-50 flex w-[min(92vw,22rem)] flex-col gap-2.5" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const COLUMNS = [
    { id: 'todo',     title: 'Треба зробити', dot: 'bg-zinc-400' },
    { id: 'progress', title: 'В роботі',      dot: 'bg-indigo-400' },
    { id: 'done',     title: 'Готово',        dot: 'bg-emerald-400' }
  ];
  const PRIORITY = {
    high:   { label: 'Високий', cls: 'text-rose-300 bg-rose-500/10 ring-rose-500/30',          dot: 'bg-rose-400' },
    medium: { label: 'Середній', cls: 'text-amber-300 bg-amber-500/10 ring-amber-500/30',      dot: 'bg-amber-400' },
    low:    { label: 'Низький', cls: 'text-emerald-300 bg-emerald-500/10 ring-emerald-500/30', dot: 'bg-emerald-400' }
  };
  const KEY = 'kanban-board-v1';

  const $ = (s, r = document) => r.querySelector(s);
  const board = $('#board'), modal = $('#modal'), form = $('#form');
  const fTitle = $('#f-title'), fDesc = $('#f-desc'), fErr = $('#f-err');

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fmtDate = ts => new Date(ts).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });

  /* ---------- Дані ---------- */
  const seed = () => {
    const d = 864e5, n = Date.now();
    return [
      { id: 's1', title: 'Спроєктувати макет головної сторінки', desc: 'Підготувати desktop- і mobile-версії та погодити їх із замовником.', priority: 'high', status: 'todo', created: n - 2 * d },
      { id: 's2', title: 'Налаштувати CI/CD для деплою', desc: 'Автоматична збірка та публікація після кожного злиття в main.', priority: 'medium', status: 'todo', created: n - 3 * d },
      { id: 's3', title: 'Написати документацію до API', desc: 'Описати ендпоінти, приклади запитів і коди помилок.', priority: 'low', status: 'todo', created: n - 4 * d },
      { id: 's4', title: 'Реалізувати авторизацію користувачів', desc: 'Вхід через email і Google, відновлення пароля.', priority: 'high', status: 'progress', created: n - 5 * d },
      { id: 's5', title: 'Код-рев’ю модуля оплати', desc: 'Перевірити обробку помилок і повторні спроби платежу.', priority: 'medium', status: 'progress', created: n - 6 * d },
      { id: 's6', title: 'Оптимізувати завантаження зображень', desc: 'Lazy loading і сучасні формати для швидшого першого екрана.', priority: 'low', status: 'done', created: n - 8 * d },
      { id: 's7', title: 'Підключити аналітику подій', desc: 'Відстежувати реєстрації та проходження воронки.', priority: 'medium', status: 'done', created: n - 9 * d }
    ];
  };
  const load = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(raw)) return raw;
    } catch (e) { /* localStorage недоступний або порожній */ }
    return seed();
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) { /* ігноруємо */ } };

  let tasks = load();
  let dragId = null, movedId = null;

  /* ---------- Відображення ---------- */
  function buildBoard() {
    board.innerHTML = COLUMNS.map(c => `
      <section class="col flex min-h-[320px] flex-col rounded-xl border border-zinc-800/80 bg-zinc-900/40 p-3" data-col="${c.id}" aria-label="${c.title}">
        <header class="flex items-center justify-between px-1.5 pb-3">
          <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full ${c.dot}"></span>
            <h2 class="text-sm font-semibold text-zinc-200">${c.title}</h2>
          </div>
          <span class="count min-w-[1.5rem] rounded-md bg-zinc-800 px-1.5 py-0.5 text-center text-xs font-medium tabular-nums text-zinc-300" data-count="${c.id}">0</span>
        </header>
        <div class="list flex flex-1 flex-col gap-2.5" data-list="${c.id}"></div>
      </section>`).join('');
  }

  function cardHTML(t) {
    const p = PRIORITY[t.priority] || PRIORITY.medium;
    return `
      <article class="card group rounded-lg border border-zinc-800 bg-zinc-900 p-3.5 ${t.id === movedId ? 'enter' : ''}" draggable="true" data-id="${t.id}">
        <div class="flex items-start justify-between gap-2">
          <h3 class="break-words text-sm font-medium leading-snug text-zinc-100">${esc(t.title)}</h3>
          <button type="button" class="del -mr-1 -mt-0.5 shrink-0 rounded-md p-1 text-zinc-600 transition hover:bg-rose-500/10 hover:text-rose-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400" aria-label="Видалити задачу" title="Видалити">
            <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5.3 5.3a1 1 0 011.4 0L10 8.6l3.3-3.3a1 1 0 111.4 1.4L11.4 10l3.3 3.3a1 1 0 01-1.4 1.4L10 11.4l-3.3 3.3a1 1 0 01-1.4-1.4L8.6 10 5.3 6.7a1 1 0 010-1.4z"/></svg>
          </button>
        </div>
        ${t.desc ? `<p class="mt-1.5 break-words text-xs leading-relaxed text-zinc-400">${esc(t.desc)}</p>` : ''}
        <div class="mt-3 flex items-center justify-between">
          <span class="inline-flex items-center gap-1.5 rounded-md px-2 py-0.5 text-[11px] font-medium ring-1 ring-inset ${p.cls}">
            <span class="h-1.5 w-1.5 rounded-full ${p.dot}"></span>${p.label}
          </span>
          <span class="text-[11px] text-zinc-500">${fmtDate(t.created)}</span>
        </div>
      </article>`;
  }

  function render() {
    COLUMNS.forEach(c => {
      const list = $(`[data-list="${c.id}"]`, board);
      const items = tasks.filter(t => t.status === c.id);
      list.innerHTML = items.length
        ? items.map(cardHTML).join('')
        : '<div class="empty grid h-20 place-items-center rounded-lg border border-dashed border-zinc-800 text-xs text-zinc-600">Перетягніть задачу сюди</div>';
      const cnt = $(`[data-count="${c.id}"]`, board);
      if (cnt.textContent !== String(items.length)) {
        cnt.textContent = items.length;
        cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump');
      }
    });
    const done = tasks.filter(t => t.status === 'done').length, total = tasks.length;
    $('#stat').textContent = total ? `Виконано ${done} з ${total}` : 'Задач поки немає';
    $('#bar').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
    movedId = null;
  }

  /* ---------- Сповіщення ---------- */
  function toast(msg, sub, dot = 'bg-indigo-400') {
    const box = $('#toasts');
    while (box.children.length >= 4) box.firstElementChild.remove();
    const el = document.createElement('div');
    el.className = 'toast pointer-events-auto flex items-start gap-3 rounded-lg border border-zinc-800 bg-zinc-900/95 px-4 py-3 shadow-xl shadow-black/50 backdrop-blur';
    el.innerHTML = `<span class="mt-1.5 h-2 w-2 shrink-0 rounded-full ${dot}"></span>
      <div class="min-w-0"><p class="text-sm font-medium text-zinc-100">${esc(msg)}</p>
      ${sub ? `<p class="mt-0.5 truncate text-xs text-zinc-400">${esc(sub)}</p>` : ''}</div>`;
    box.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 3200);
  }

  /* ---------- Дії ---------- */
  function moveTask(id, status, afterId) {
    const i = tasks.findIndex(t => t.id === id);
    if (i < 0) return;
    const [t] = tasks.splice(i, 1);
    const prev = t.status;
    t.status = status;
    const j = afterId ? tasks.findIndex(x => x.id === afterId) : -1;
    if (j >= 0) tasks.splice(j, 0, t); else tasks.push(t);
    movedId = id;
    save(); render();
    if (prev !== status) {
      const col = COLUMNS.find(c => c.id === status);
      toast(`Задачу перенесено в статус «${col.title}»`, t.title, col.dot);
    }
  }

  function removeTask(card) {
    const id = card.dataset.id, t = tasks.find(x => x.id === id);
    card.classList.add('leave');
    setTimeout(() => {
      tasks = tasks.filter(x => x.id !== id);
      save(); render();
      toast('Задачу видалено', t && t.title, 'bg-rose-400');
    }, 220);
  }

  /* ---------- Drag and Drop (нативний HTML5 API) ---------- */
  const ph = document.createElement('div');
  ph.className = 'drop-ph';

  const clearDrag = () => {
    board.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    ph.remove();
  };

  function cardAfter(list, y) {
    const cards = [...list.querySelectorAll('.card:not(.dragging)')];
    return cards.find(c => { const b = c.getBoundingClientRect(); return y < b.top + b.height / 2; }) || null;
  }

  board.addEventListener('dragstart', e => {
    const card = e.target.closest && e.target.closest('.card');
    if (!card) return;
    dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
    setTimeout(() => card.classList.add('dragging'), 0);
  });

  board.addEventListener('dragover', e => {
    if (!dragId) return;
    const col = e.target.closest('.col');
    if (!col) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    board.querySelectorAll('.drag-over').forEach(c => { if (c !== col) c.classList.remove('drag-over'); });
    col.classList.add('drag-over');
    const list = $('.list', col), after = cardAfter(list, e.clientY);
    if (after) { if (ph.parentNode !== list || ph.nextElementSibling !== after) list.insertBefore(ph, after); }
    else if (ph.parentNode !== list || ph.nextElementSibling) list.appendChild(ph);
  });

  board.addEventListener('dragleave', e => {
    const col = e.target.closest('.col');
    if (col && !col.contains(e.relatedTarget)) {
      col.classList.remove('drag-over');
      if (col.contains(ph)) ph.remove();
    }
  });

  board.addEventListener('drop', e => {
    if (!dragId) return;
    const col = e.target.closest('.col');
    if (!col) return;
    e.preventDefault();
    const id = dragId; dragId = null;
    const next = ph.parentNode && col.contains(ph) ? ph.nextElementSibling : null;
    const afterId = next && next.classList.contains('card') ? next.dataset.id : null;
    clearDrag();
    moveTask(id, col.dataset.col, afterId);
  });

  board.addEventListener('dragend', () => {
    dragId = null; clearDrag();
    board.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging'));
  });

  board.addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if (btn) removeTask(btn.closest('.card'));
  });

  /* ---------- Модальне вікно ---------- */
  const openModal = () => {
    form.reset(); fErr.classList.add('hidden');
    modal.classList.remove('hidden'); modal.classList.add('flex');
    setTimeout(() => fTitle.focus(), 30);
  };
  const closeModal = () => {
    modal.classList.add('hidden'); modal.classList.remove('flex');
    $('#add').focus();
  };

  $('#add').addEventListener('click', openModal);
  modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal(); });
  fTitle.addEventListener('input', () => fErr.classList.add('hidden'));

  form.addEventListener('submit', e => {
    e.preventDefault();
    const title = fTitle.value.trim();
    if (!title) { fErr.classList.remove('hidden'); fTitle.focus(); return; }
    const t = {
      id: uid(), title, desc: fDesc.value.trim(),
      priority: form.priority.value || 'medium', status: 'todo', created: Date.now()
    };
    tasks.unshift(t);
    movedId = t.id;
    save(); render(); closeModal();
    toast('Задачу додано', t.title, 'bg-indigo-400');
  });

  $('#reset').addEventListener('click', () => {
    tasks = seed(); save(); render();
    toast('Демо-дані відновлено');
  });

  buildBoard();
  render();
})();
</script>
</body>
</html>
